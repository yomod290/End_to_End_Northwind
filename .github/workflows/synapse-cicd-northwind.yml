name: synapse-cicd-northwind

on:
  workflow_dispatch:
  # Si luego quieres automático, descomenta esto PERO recuerda:
  # el YAML también debe existir en la rama workspace_publish
  # push:
  #   branches: ["workspace_publish"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy Synapse to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace_publish (Synapse publish artifacts)
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Synapse PROD
        uses: Azure/Synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: prodsynapsenorthwind
          TemplateFile: devsynapsenorthwind/TemplateForWorkspace.json
          ParametersFile: devsynapsenorthwind/TemplateParametersForWorkspace.json

          # ✅ OJO: el input correcto es resourceGroup (NO resourceGroupName)
          resourceGroup: GR-PROD-NORTHWIND

          # (Opcional pero recomendado)
          operation: deploy
          DeleteArtifactsNotInTemplate: false

          # ✅ Overrides: deben matchear EXACTO los nombres del TemplateParametersForWorkspace.json
          OverrideArmParameters: >
            -workspaceName prodsynapsenorthwind
            -KeyVault_LS_properties_typeProperties_baseUrl https://prodonpremisenorthwind.vault.azure.net/
            -LS_adsl_sink_properties_typeProperties_url https://adslprodnorthwind.dfs.core.windows.net/
            -devsynapsenorthwind-WorkspaceDefaultStorage_properties_typeProperties_url https://adslprodnorthwind.dfs.core.windows.net/
