name: synapse-cicd-northwind-arm

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy_synapse_workspace_prod:
    name: Deploy minimal Synapse workspace (PROD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Synapse Workspace only (ARM)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: GR-PROD-NORTHWIND
          deploymentName: synapse-minimal-workspace-prod
          template: synapse/minimal-workspace.json
          additionalArguments: >
            --parameters
            workspaceName=prodsynapsenorthwind
            location=brazilsouth
            defaultDataLakeStorageAccountUrl=https://adlsprodnorthwind.dfs.core.windows.net
            defaultDataLakeFilesystem=silver
            sqlAdministratorLogin=${{ secrets.SYNAPSE_SQL_ADMIN_USER }}
            sqlAdministratorLoginPassword=${{ secrets.SYNAPSE_SQL_ADMIN_PASSWORD }}
