name: synapse-cicd-northwind

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente destino"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
  push:
    branches:
      - workspace_publish

permissions:
  id-token: write
  contents: read

jobs:
  deploy-synapse-to-prod:
    name: Deploy Synapse to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy del workspace (ARM generado por Publish)
      - name: Deploy Synapse Workspace
        uses: Azure/Synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: "prodsynapsenorthwind"
          TemplateFile: "devsynapsenorthwind/TemplateForWorkspace.json"
          ParametersFile: "devsynapsenorthwind/TemplateParametersForWorkspace.json"
          ResourceGroupName: "GR-PROD-NORTHWIND"

          # Si necesitas sobreescribir valores DEV -> PROD (URLs, KV, etc)
          # OJO: usa los nombres exactos que salen en TemplateParametersForWorkspace.json
          OverrideArmParameters: |
            -workspaceName "prodsynapsenorthwind"
            -KeyVault_LS_properties_typeProperties_baseUrl "https://prodonpremisenorthwind.vault.azure.net/"
            -LS_adsl_sink_properties_typeProperties_url "https://adlsprodnorthwind.dfs.core.windows.net/"
