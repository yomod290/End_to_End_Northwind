name: synapse-cicd-northwind

on:
  push:
    branches: ["workspace_publish"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy Synapse to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace_publish
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Despliegue a PROD usando lo publicado desde DEV
      - name: Deploy to Synapse PROD
        uses: Azure/synapse-workspace-deployment@v1.7.0
        with:
          TargetWorkspaceName: "prodsynapsenorthwind"
          TemplateFile: "./devsynapsenorthwind/TemplateForWorkspace.json"
          ParametersFile: "./devsynapsenorthwind/TemplateParametersForWorkspace.json"
          resourceGroupName: "GR-PROD-NORTHWIND"
          managedIdentity: "true"

          # ✅ Overrides (esto es lo importante)
          OverrideArmParameters: >
            -workspaceName prodsynapsenorthwind
            -KeyVault_LS_properties_typeProperties_baseUrl https://prodonpremisenorthwind.vault.azure.net/
            -LS_adsl_sink_properties_typeProperties_url https://adslprodnorthwind.dfs.core.windows.net/
            -devsynapsenorthwind-WorkspaceDefaultStorage_properties_typeProperties_url https://adslprodnorthwind.dfs.core.windows.net/
