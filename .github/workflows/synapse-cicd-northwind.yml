name: synapse-cicd-northwind

on:
  workflow_dispatch:
  push:
    branches:
      - workspace_publish

permissions:
  id-token: write
  contents: read

jobs:
  deploy_sqlscripts_prod:
    name: Deploy Synapse SQL Scripts to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace_publish
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy SQL Scripts only (sqlscript/*.json)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e

            WORKSPACE="prodsynapsenorthwind"
            API_VERSION="2020-12-01"

            if [ ! -d "sqlscript" ]; then
              echo "❌ No existe la carpeta 'sqlscript/' en el branch workspace_publish."
              echo "Tip: En Synapse Studio, Publish y verifica que se generen artefactos en workspace_publish."
              exit 1
            fi

            echo "✅ Scripts encontrados en ./sqlscript:"
            ls -la sqlscript

            for f in sqlscript/*.json; do
              [ -e "$f" ] || continue

              SCRIPT_NAME=$(python - <<'PY'
              import json,sys,os
              p=sys.argv[1]
              with open(p,'r',encoding='utf-8') as fh:
                j=json.load(fh)
              name=j.get("name") or os.path.splitext(os.path.basename(p))[0]
              print(name)
              PY
              "$f")

              echo "➡️ Deploying SQL script: $SCRIPT_NAME"

              az rest \
                --method put \
                --uri "https://${WORKSPACE}.dev.azuresynapse.net/sqlscripts/${SCRIPT_NAME}?api-version=${API_VERSION}" \
                --headers "Content-Type=application/json" \
                --body @"$f" \
                --only-show-errors

            done

            echo "🎉 Listo: SQL scripts desplegados a ${WORKSPACE}"
