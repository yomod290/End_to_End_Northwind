name: synapse-cicd-northwind

on:
  workflow_dispatch:
  push:
    branches:
      - workspace_publish

permissions:
  id-token: write
  contents: read

jobs:
  deploy_synapse_prod:
    name: Deploy Synapse to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace_publish (Synapse publish artifacts)
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Synapse workspace to PROD
        uses: Azure/Synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: prodsynapsenorthwind
          resourceGroup: GR-PROD-NORTHWIND
          TemplateFile: devsynapsenorthwind/TemplateForWorkspace.json
          ParametersFile: devsynapsenorthwind/TemplateParametersForWorkspace.json
          OverrideArmParameters: >
            -workspaceName "prodsynapsenorthwind"
            -LS_adsl_sink_properties_typeProperties_url "https://adlsprodnorthwind.dfs.core.windows.net/"
            -devsynapsenorthwind-WorkspaceDefaultStorage_properties_typeProperties_url "https://adlsprodnorthwind.dfs.core.windows.net"
            -KeyVault_LS_properties_typeProperties_baseUrl "https://prodonpremisenorthwind.vault.azure.net/"
            -devsynapsenorthwind-WorkspaceDefaultSqlServer_connectionString "Integrated Security=False;Encrypt=True;Connection Timeout=30;Data Source=tcp:prodsynapsenorthwind.sql.azuresynapse.net,1433;Initial Catalog=master"
          Environment: Azure Public
          operation: deploy
          FailOnMissingOverrides: false
