name: synapse-cicd-northwind

on:
  workflow_dispatch:
  push:
    branches:
      - workspace_publish

permissions:
  id-token: write
  contents: read

jobs:
  deploy_synapse_prod:
    name: Deploy Synapse ARM to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace_publish (Synapse publish artifacts)
        uses: actions/checkout@v4
        with:
          ref: workspace_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # (Opcional) Verifica que los templates existan
      - name: List templates folder
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "PWD=$(pwd)"
            ls -la
            echo "---- devsynapsenorthwind folder ----"
            ls -la devsynapsenorthwind || true
            echo "---- Template files ----"
            ls -la devsynapsenorthwind/TemplateForWorkspace.json || true
            ls -la devsynapsenorthwind/TemplateParametersForWorkspace.json || true

      - name: Deploy Synapse ARM to PROD
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: GR-PROD-NORTHWIND
          deploymentName: synapse-prod-deploy
          template: devsynapsenorthwind/TemplateForWorkspace.json
          parameters: devsynapsenorthwind/TemplateParametersForWorkspace.json
          additionalArguments: >
            --parameters
            workspaceName=prodsynapsenorthwind
            # Si con workspaceName no funciona, comenta la línea de arriba y usa esta:
            # devsynapsenorthwind-WorkspaceName=prodsynapsenorthwind

      # Si falla, muestra el error real del deployment (MUY útil)
      - name: Show ARM error details
        if: failure()
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "---- DEPLOYMENT ERROR ----"
            az deployment group show \
              --resource-group GR-PROD-NORTHWIND \
              --name synapse-prod-deploy \
              --query "properties.error" -o json

            echo "---- OPERATIONS (first 50) ----"
            az deployment operation group list \
              --resource-group GR-PROD-NORTHWIND \
              --name synapse-prod-deploy \
              --query "[0:50].{state:properties.provisioningState, code:properties.statusMessage.error.code, message:properties.statusMessage.error.message, target:properties.targetResource.resourceName}" \
              -o table
